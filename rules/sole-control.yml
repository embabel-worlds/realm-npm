# A conclusion over a conclusion: the accounts that are the ONLY publisher of something you install.
#
# This is the stratified rule set of the three, and the stratification is the point rather than a
# detail of the implementation. `single-account.yml` decides, by an aggregate over publish rights,
# which packages have exactly one entitled account. This rule set reads that LABEL and concludes an
# edge over it. The engine orders the two because the body of the second mentions the head of the
# first; nothing here says which runs when.
#
# Inlined into one query instead, the maintainer count would be recomputed inside the traversal at
# every hop, and "what counts as a single-account package" would be defined twice — once here and
# once in every other question that needs it. That is the argument for a rule rather than a query,
# and it is the same argument Datalog has always made.
#
# WHY IT IS THE NUMBER WORTH LEADING WITH. `CONTROLS` counts how many packages an account MAY
# publish; some of those have three other maintainers who would notice. `SOLE_CONTROL` counts the
# ones where that account is the whole of the authority — no second pair of hands to spot an
# unexpected release, and no one else able to publish a fix if the account is lost. It is the
# narrowest honest reading of "how much of this install rests on one credential".
#
# STILL NOT A FINDING. The overwhelming majority of npm packages have one maintainer and are fine.
# A large number here describes how CONCENTRATED your tree is, which is a fact about your
# dependency choices, and says nothing whatever about how well anybody protects their account —
# npm does not publish that, so this realm cannot know it.

name: npm/sole-control
derives: SOLE_CONTROL
description: >-
  An account that is the ONLY entitled publisher of one or more packages in an application's
  dependency tree, with `packages` counting how many. Concluded over `SingleAccountPackage`, which
  is itself concluded from publish rights — so the two rule sets are ordered by the engine rather
  than by the author.

  Describes concentration, never conduct or credential strength. One maintainer is the npm norm and
  most single-maintainer packages are well looked after; what a large count means is that many of
  your dependencies would fail together.
properties:
  packages:
    type: int
    description: "Distinct packages in this tree for which this account is the sole entitled publisher."
# THE CALLER MUST BRING THE FACTS, and that is a real constraint rather than a style note. A rule
# body reads what the transaction already holds; it cannot fetch. The dependency tree and its
# publish rights are producer-backed, so a query that anchors only on the root materialises neither,
# and this rule set then concludes over an empty graph — truthfully, and uselessly. Every shipped
# view in `views/supply-chain.yml` therefore walks the tree and reads its accounts FIRST, and the
# rules conclude over what that brought in. A caller writing its own query must do the same.
#
# SEED THE ACCOUNTS FROM THE DEPENDENCIES, never from the root. Binding NpmMaintainer off the root
# package before the deep fan-out marks that label materialised, and the fan-out to the tree's
# accounts becomes a semijoin against what is already present — one account back, no error.
maxPairs: 20000
rules:
  # `d` is bound by the DERIVED label, which is what makes this stratum two. The second MATCH then
  # names the account: a SingleAccountPackage has exactly one, by construction of the rule that
  # labelled it, so no aggregate is needed to pick it out.
  - derive: "(a)-[:SOLE_CONTROL {packages: n}]->(root)"
    from: |
      MATCH (root:NpmPackage)-[:HAS_LATEST_RELEASE]->(:NpmRelease)-[:HAS_DEPENDENCY*1..3]->(d:SingleAccountPackage)
      MATCH (d)-[:MAINTAINED_BY]->(a:NpmMaintainer)
      WITH root, a, count(DISTINCT d.name) AS n
      WHERE n >= 1
