# THE EDGE npm DOES NOT PUBLISH: an account, and the application it can put code into.
#
# npm publishes publish rights PER PACKAGE. It publishes nothing that connects an account to YOUR
# install, and that connection is the one that decides how much of your supply chain rests on any
# single credential staying uncompromised. There is no edge to traverse here: `*1..n` can walk
# HAS_DEPENDENCY, but the relationship between an account and a root is not a path in the graph —
# its EXISTENCE is a conclusion, drawn from a count of distinct packages crossing a threshold. That
# is the one shape a traversal cannot express, and it is what a derived relationship is for.
#
# WHAT THE EDGE MEANS, exactly. `(a)-[:CONTROLS {packages: n}]->(root)` says: account `a` is
# entitled to publish `n` distinct packages that appear in `root`'s dependency tree, within the
# depth this realm walked. It does not say the account has done anything, will do anything, or is
# poorly secured. npm publishes no two-factor status, so nothing here is a statement about how well
# any credential is protected.
#
# READ IT AS CONCENTRATION. A single account that can publish one package in a tree of seventy is
# the ordinary case and is not interesting. The same account able to publish fifteen of them is a
# different shape: it means fifteen of your dependencies fail together. That is a fact about how
# the ecosystem is organised — one person maintains a family of small modules — far more often than
# it is a fact about risk, and the number is there so a reader can tell which.

name: npm/publish-concentration
derives: CONTROLS
description: >-
  An account entitled to publish several distinct packages in an application's dependency tree,
  with `packages` counting how many. An edge npm does not publish: the registry records rights per
  package, and the connection to a whole install is a conclusion rather than a path.

  NOT A FINDING. One person maintaining a family of small modules produces this in volume and
  entirely ordinarily. What the count distinguishes is how much of a tree fails together, never
  anybody's conduct or the strength of their credentials, which npm does not publish at all.
properties:
  packages:
    type: int
    description: "Distinct packages in this tree the account may publish. 1 is the ordinary case; a large number means that many of your dependencies share a single point of failure."
# THE CALLER MUST BRING THE FACTS, and that is a real constraint rather than a style note. A rule
# body reads what the transaction already holds; it cannot fetch. The dependency tree and its
# publish rights are producer-backed, so a query that anchors only on the root materialises neither,
# and this rule set then concludes over an empty graph — truthfully, and uselessly. Every shipped
# view in `views/supply-chain.yml` therefore walks the tree and reads its accounts FIRST, and the
# rules conclude over what that brought in. A caller writing its own query must do the same.
#
# SEED THE ACCOUNTS FROM THE DEPENDENCIES, never from the root. Binding NpmMaintainer off the root
# package before the deep fan-out marks that label materialised, and the fan-out to the tree's
# accounts becomes a semijoin against what is already present — one account back, no error.
# Accounts times roots, and an account reaches a root once. A tree of a few hundred packages has a
# few hundred accounts, so a handful of roots stays well inside this. Tripping it means the query
# anchored on more applications than a person is going to read.
maxPairs: 20000
rules:
  # DISTINCT ON NAME, not on node. deps.dev resolves the same package from several parents, so a
  # package is several NpmDependency nodes; the account node is shared by all of them because its
  # identity is the account. Counting nodes would count how many ways the tree reaches a package
  # and report it as concentration.
  - derive: "(a)-[:CONTROLS {packages: n}]->(root)"
    from: |
      MATCH (root:NpmPackage)-[:HAS_LATEST_RELEASE]->(:NpmRelease)-[:HAS_DEPENDENCY*1..3]->(d:NpmDependency)-[:MAINTAINED_BY]->(a:NpmMaintainer)
      WITH root, a, count(DISTINCT d.name) AS n
      WHERE n >= 1
