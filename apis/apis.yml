# Two sources, no credential. Both npm hosts are open and keyless, so the realm
# works the moment it is installed with nothing to configure.
#
# Only parameter-free-by-package operations are declared. npm's download API
# does offer arbitrary date ranges, but every range endpoint needs an explicit
# `from..to` in its path, and a producer's arguments are static — there is no
# way to say "the last 30 days from today". So this realm answers about the last
# SEVEN days (a fixed path segment) and about NOW, and says so.
- url: npm-downloads.json
  name: npm_downloads
  type: openapi
  auth: none
  operation-ids:
    - weeklyDownloads

- url: npm-registry.json
  name: npm_registry
  type: openapi
  auth: none
  operation-ids:
    - packageLatest

# deps.dev — Google's Open Source Insights. Keyless like the two npm hosts, and the reason
# this realm can answer about the dependency GRAPH rather than one package at a time.
# `system` is a static argument (NPM) because that is the only system this realm models;
# deps.dev publishes dependencies for four, and the other three 404.
- url: deps-dev.json
  name: deps_dev
  type: openapi
  auth: none
  operation-ids:
    - packageDependencies
    - packageVersion
    - projectInfo

# GitHub, for the three facts deps.dev cannot give: ARCHIVED, the default branch's real last commit,
# and whether the repository a package claims resolves at all. A token lifts the rate limit from 60
# an hour to 5,000; without one the realm still works and simply reads fewer repositories.
- url: github-repo.json
  name: github_repo
  type: openapi
  auth: none
  headers:
    Accept: "application/vnd.github+json"
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: "Bearer ${GH_TOKEN}"
  operation-ids:
    - repoFacts
    - repoLastCommit
