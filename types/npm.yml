# One STORED type and two VIRTUAL ones.
#
#   NpmPackage ──HAS_WEEKLY_DOWNLOADS──▶ NpmDownloads   per package
#   NpmPackage ──HAS_LATEST_RELEASE────▶ NpmRelease     per package
#
# Both virtual types are PER PACKAGE, not shared: two packages downloaded the
# same number of times are still two different readings. So each one's identity
# is `key` — the package name the reading was fetched for — and never a value
# from the response body, which would collapse distinct packages into one node.

- name: NpmPackage
  description: "A package you depend on or watch. The one thing seeded by hand. `name` is the exact npm name — unscoped, e.g. `react` — and is both the identity and the key every producer fetches by. A wrong name is not an error here; it is a reading that never arrives."
  properties:
    name:
      description: "Exact npm package name, e.g. `react`. Identity, and the key every fetch uses."
      metadata:
        identity: "true"
    notes: "Why you track this — the service that depends on it, or what you are watching for."
  examples:
    # STEERING. NpmPackage is seeded by hand; every other type is read live from it. Dependency
    # trees are walked by chained hops, never by a variable-length pattern, because only a hop drives
    # the fetch. Package names match exactly, scoped names included.
    - q: "how many times was express downloaded last week and what version is current"
      cypher: |
        MATCH (p:NpmPackage {name: 'express'})-[:HAS_WEEKLY_DOWNLOADS]->(d:NpmDownloads)
        OPTIONAL MATCH (p)-[:HAS_LATEST_RELEASE]->(r:NpmRelease)
        RETURN p.name AS package, d.count AS weeklyDownloads, r.version AS version, r.license AS license
    - q: "what does express depend on directly"
      cypher: |
        MATCH (p:NpmPackage {name: 'express'})-[:HAS_LATEST_RELEASE]->(r:NpmRelease)-[:HAS_DEPENDENCY]->(d:NpmDependency)
        RETURN DISTINCT d.name AS dependency, d.version AS resolvedVersion
        ORDER BY dependency
    - q: "who can publish lodash"
      cypher: |
        MATCH (p:NpmPackage {name: 'lodash'})-[:MAINTAINED_BY]->(a:NpmMaintainer)
        RETURN DISTINCT a.account AS account ORDER BY account
    - q: "is the repository express comes from archived, and what is its scorecard"
      cypher: |
        MATCH (p:NpmPackage {name: 'express'})-[:HAS_LATEST_RELEASE]->(r:NpmRelease)-[:HAS_SOURCE_PROJECT]->(s:NpmSourceProject)
        OPTIONAL MATCH (s)-[:HAS_PROJECT_HEALTH]->(h:NpmProjectHealth)
        OPTIONAL MATCH (s)-[:HAS_REPO_FACTS]->(f:NpmRepoFacts)
        RETURN s.projectKey AS repository, s.relationProvenance AS linkProvenance, h.overallScore AS scorecard, f.archived AS archived

# Momentum.
- name: NpmDownloads
  description: "One package's npm download count for the last seven complete days, identified by `key` (the package name it was read for), read live from api.npmjs.org. Reached from NpmPackage via HAS_WEEKLY_DOWNLOADS. This is an ADOPTION signal, not a security one: a spike is often just a fresh release or a CI mirror, and a fall can mean the ecosystem moved on. It means something next to the release date and nothing on its own."
  virtualJoins:
    - anchorLabel: NpmPackage
      relationship: HAS_WEEKLY_DOWNLOADS
      keyField: name
      recordKeyField: key
      producer: weeklyDownloads
      description: "This package's last-week download count (zero or one reading). One api.npmjs.org call per package, cached 12 hours; no edge means npm does not know the name. For 'is this still widely used'."
  properties:
    key:
      description: "The package name this was fetched for. Identity — one reading per package."
      metadata:
        identity: "true"
    count: { type: int, description: "Downloads in the seven days periodStart..periodEnd, a count of tarball fetches (CI and mirrors included), not of users." }
    periodStart: "First UTC day counted, inclusive, ISO YYYY-MM-DD."
    periodEnd: "Last UTC day counted, inclusive, ISO YYYY-MM-DD; normally yesterday or the day before."

# Current published state.
- name: NpmRelease
  description: "One package's latest published release on the npm registry, identified by `key` (the package name): what `npm install <package>` resolves to right now, its licence and description. Reached from NpmPackage via HAS_LATEST_RELEASE. The licence is the field that earns this producer its keep: it is the obligation you actually took on, read from the registry rather than from whatever a README claims."
  virtualJoins:
    - anchorLabel: NpmPackage
      relationship: HAS_LATEST_RELEASE
      keyField: name
      recordKeyField: key
      producer: packageLatest
      description: "This package's latest published release (zero or one): version, licence, publisher, provenance and declared repository. One registry call per package, cached an hour and shared with MAINTAINED_BY. The start of every dependency walk: (p)-[:HAS_LATEST_RELEASE]->(r)-[:HAS_DEPENDENCY]->(d)."
  properties:
    key:
      description: "The package name. Identity — one latest-release node per package."
      metadata:
        identity: "true"
    version: "The version the `latest` dist-tag points at now, exact semver as published, e.g. 4.21.2. Changes when the maintainers publish."
    description: "The package's own one-line description from its package.json, as the author wrote it; empty when none."
    license: "SPDX licence id, e.g. `MIT`. Null for the handful of ancient packages that still publish the legacy object form, which is the safe failure rather than a wrong guess."
    homepage: "The homepage URL the package declares in package.json, unverified; empty when it declares none."
    publishedBy: >-
      The npm account that actually ran the publish for THIS version. Different from the
      maintainer list, which says who is allowed to: this says who did. A CI identity here
      (`GitHub Actions` is common) means the credential lives in a workflow rather than on
      somebody's laptop, which is a materially different posture and worth seeing. Absent on old
      releases, and absence means the registry did not record it rather than that nobody published.
    provenanceUrl: >-
      The npm attestation bundle for this version, when one exists. Its PRESENCE is the fact: npm
      recorded a build attestation, so this tarball can be traced to a workflow run in a named
      repository rather than to somebody's laptop. Absent means npm recorded none, which is NOT the
      same as carelessness — provenance is recent, opt-in and needs supported CI, so most of the
      registry predates it. Read an absence as "not stated".
    provenanceType: >-
      The attestation's predicate type, e.g. `https://slsa.dev/provenance/v1`. Present exactly when
      `provenanceUrl` is, and worth carrying because the predicate is what says WHAT was attested.
    repository: >-
      The source repository URL the package DECLARES. Unverified by npm and unverified here — a
      package may name any repository it likes, which is how impersonation works — so treat it as
      a claim to follow, never as provenance. It is also the join key into a repository-scoped
      realm: strip the scheme and `.git` and you have the `github.com/owner/repo` form that
      OpenSSF Scorecard and deps.dev index on.
